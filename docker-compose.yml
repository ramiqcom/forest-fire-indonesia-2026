services:
  firms:
    build:
      context: .
      secrets:
        - github_token
    command: [ ".venv/bin/python", "-m", "job.firms" ]
    volumes:
      - ./input:/usr/src/app/input
      - ./output:/usr/src/app/output
    env_file:
      - .env
    secrets:
      - gcp_credentials
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_credentials
      # gcloud ignores GOOGLE_APPLICATION_CREDENTIALS, this makes gcloud storage use the same key
      CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /run/secrets/gcp_credentials
  firms_grid:
    build:
      context: .
      secrets:
        - github_token
    command: [ ".venv/bin/python", "-m", "job.firms_grid" ]
    volumes:
      - ./input:/usr/src/app/input
      - ./output:/usr/src/app/output
    env_file:
      - .env
    secrets:
      - gcp_credentials
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_credentials
      CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /run/secrets/gcp_credentials

# GitHub token with read access to space4good/s4g-lib, used only at build time
secrets:
  github_token:
    environment: GITHUB_TOKEN
  # Service account key for the rs-open-source API, mounted read-only at runtime, never in the image
  gcp_credentials:
    # Fixed path, the VS Code terminal can carry a stale GOOGLE_APPLICATION_CREDENTIALS from .env
    file: ./private_key.json
