[project]
name = "forest_fire"
version = "0.1.0"
description = "Script to generate forest fire data 2026"
authors = [
    {name = "Ramadhan", email = "ramadhan@space4good.com"}
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "rasterio",
    "geopandas",
    "scikit-learn",
    "scikit-image",
    "xgboost",
    "google-auth",
    "s4g-lib @ git+https://github.com/space4good/s4g-lib@composite-workflow"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4", "jupyterlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
